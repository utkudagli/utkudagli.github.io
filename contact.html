<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Utku Dağlı</title>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    ::selection {
      background: #000;
      color: #fff;
    }

    body {
      min-height: 100vh;
      background-color: #fff;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .link {
      color: #666;
      text-decoration: none;
      transition: color 0.2s;
      cursor: pointer;
    }

    .link:hover {
      color: #000;
    }

    .link.active {
      color: #000;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      padding: 24px 48px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #eee;
      background: #fff;
      z-index: 100;
    }

    header h1 {
      font-size: 16px;
      font-weight: 500;
    }

    header p {
      font-size: 14px;
      color: #888;
      margin-top: 2px;
    }

    nav {
      display: flex;
      gap: 32px;
    }

    /* Contact Section */
    .contact-section {
      padding: 48px;
      max-width: 600px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 16px;
    }

    .contact-intro {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 24px;
      line-height: 1.5;
      color: #333;
      margin-bottom: 64px;
    }

    /* Contact Items */
    .contact-item {
      margin-bottom: 48px;
    }

    .contact-item h3 {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 16px;
    }

    .email-link {
      font-size: 18px;
      color: #333;
      text-decoration: underline;
      text-underline-offset: 4px;
      transition: color 0.2s;
    }

    .email-link:hover {
      color: #000;
    }

    .location-text {
      font-size: 16px;
      color: #444;
      line-height: 1.6;
    }

    .location-text span {
      color: #888;
    }

    /* Social Links */
    .social-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 0;
      color: #666;
      transition: color 0.2s;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .social-link:hover {
      color: #000;
    }

    .social-link:last-child {
      border-bottom: none;
    }

    .social-link span.name {
      font-size: 15px;
    }

    .social-link span.arrow {
      margin-left: auto;
      font-size: 14px;
    }

    /* Footer */
    footer {
      padding: 24px 48px;
      border-top: 1px solid #eee;
      font-size: 13px;
      color: #aaa;
      margin-top: 80px;
    }

    /* Scroll to Top Button */
    .scroll-top-btn {
      position: fixed;
      bottom: 32px;
      left: 32px;
      width: 40px;
      height: 40px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
    }

    .scroll-top-btn.visible {
      opacity: 1;
      visibility: visible;
    }

    .scroll-top-btn:hover {
      border-color: #000;
      background: #000;
      color: #fff;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div>
      <h1><a href="index.html">Utku Dağlı</a></h1>
      <p>Game Designer & Developer</p>
    </div>
    <nav>
      <a href="resume.html" class="link">Resume</a>
      <a href="certificates.html" class="link">Certificates</a>
      <a href="blog.html" class="link">Blog</a>
      <a href="contact.html" class="link active">Contact</a>
    </nav>
  </header>

  <!-- Contact Section -->
  <section class="contact-section">
    <h2 class="section-title">Contact</h2>
    <p class="contact-intro">Have a project in mind or just want to say hello? I'd love to hear from you.</p>

    <!-- Email -->
    <div class="contact-item">
      <h3>Email</h3>
      <a href="mailto:utku@utkudagli.com" class="email-link">utku@utkudagli.com</a>
    </div>

    <!-- Location -->
    <div class="contact-item">
      <h3>Location</h3>
      <p class="location-text">
        Klagenfurt, Austria<br>
        <span>Open to remote work</span>
      </p>
    </div>

    <!-- Social Links -->
    <div class="contact-item">
      <h3>Social</h3>
      <div class="social-links">
        <a href="https://www.linkedin.com/in/utkudagli" target="_blank" rel="noopener noreferrer" class="social-link">

          </svg>
          <span class="name">LinkedIn</span>
          <span class="arrow">↗</span>
        </a>

        <a href="https://www.youtube.com/@UtkuLudens" target="_blank" rel="noopener noreferrer" class="social-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
          <span class="name">YouTube</span>
          <span class="arrow">↗</span>
        </a>

        <a href="https://utkudagli.itch.io" target="_blank" rel="noopener noreferrer" class="social-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3.13 1.338C2.08 1.96 1.5 3.293 1.5 4.5v.72c0 1.37.86 2.28 2.04 2.28 1.18 0 2.04-.91 2.04-2.28 0 1.37.86 2.28 2.04 2.28s2.04-.91 2.04-2.28c0 1.37.86 2.28 2.04 2.28h.6c1.18 0 2.04-.91 2.04-2.28 0 1.37.86 2.28 2.04 2.28s2.04-.91 2.04-2.28c0 1.37.86 2.28 2.04 2.28 1.18 0 2.04-.91 2.04-2.28v-.72c0-1.207-.58-2.54-1.63-3.162C19.394.925 16.262.5 12 .5c-4.262 0-7.394.425-8.87 1.338zM2 9v11.5c0 1.38 1.12 2.5 2.5 2.5h15c1.38 0 2.5-1.12 2.5-2.5V9h-1v11.5c0 .83-.67 1.5-1.5 1.5h-15c-.83 0-1.5-.67-1.5-1.5V9H2zm6.5 2.5h7v7h-7v-7zm1 1v5h5v-5h-5z"/>
          </svg>
          <span class="name">itch.io</span>
          <span class="arrow">↗</span>
        </a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    © 2025 Utku Dağlı
  </footer>

  <!-- Scroll to Top Button -->
  <button class="scroll-top-btn" id="scrollTopBtn" onclick="scrollToTop()">↑</button>

  <script>
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('scroll', () => {
      const btn = document.getElementById('scrollTopBtn');
      if (window.scrollY > 400) {
        btn.classList.add('visible');
      } else {
        btn.classList.remove('visible');
      }
    });
  </script>
</body>
</html>
